<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="ft fd">
  <title id="ft">Un gatito y un destello de IA alrededor de una fogata</title>
  <desc id="fd">Un gatito celeste y un destello naranja tipo IA, sentados uno a cada lado de una fogata con llamas que se mueven, bajo un cielo con estrellas.</desc>
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153A63"/>
      <stop offset="0.6" stop-color="#2F86D6"/>
      <stop offset="1" stop-color="#6DB6F2"/>
    </linearGradient>
    <radialGradient id="fcatBody" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D6EEFF"/>
      <stop offset="1" stop-color="#8FC4F2"/>
    </radialGradient>
    <radialGradient id="faiGlow" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFF4E0"/>
      <stop offset="0.45" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#E8702A"/>
    </radialGradient>
    <linearGradient id="fstar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFE2FF"/>
    </linearGradient>
    <linearGradient id="fflameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8702A"/>
      <stop offset="0.6" stop-color="#FFA23D"/>
      <stop offset="1" stop-color="#FFE39B"/>
    </linearGradient>
    <linearGradient id="fflameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.6" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FFF6DE"/>
    </linearGradient>
    <radialGradient id="ffireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB15C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB15C" stop-opacity="0"/>
    </radialGradient>
    <filter id="fsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="fglowAI" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="fsparkle" viewBox="-10 -10 20 20">
      <path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="url(#fstar)"/>
    </symbol>
    <style>
      .fbob-1 { animation: fbob 6s ease-in-out infinite; }
      .fbob-2 { animation: fbob 7s ease-in-out infinite -2.5s; }
      .ftail { animation: ftail 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom left; }
      .fai-pulse { animation: faipulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fai-spin { animation: faispin 18s linear infinite; transform-box: fill-box; transform-origin: center; }
      .ftwinkle { animation: ftwinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .ftwinkle.d2 { animation-delay: -1.2s; }
      .ftwinkle.d3 { animation-delay: -2.1s; }
      .fblink { animation: fblink 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fflame-o { animation: fflickerO 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
      .fflame-i { animation: fflickerI 1.3s ease-in-out infinite -0.4s; transform-box: fill-box; transform-origin: bottom center; }
      .fglow-pulse { animation: fglowpulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fember-1 { animation: fember 3.4s ease-in infinite; }
      .fember-2 { animation: fember 2.8s ease-in infinite -1.1s; }
      .fember-3 { animation: fember 3.1s ease-in infinite -2s; }
      @keyframes fbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes ftail { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(14deg); } }
      @keyframes faipulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes faispin { to { transform: rotate(360deg); } }
      @keyframes ftwinkle { 0%,100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes fblink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
      @keyframes fflickerO { 0% { transform: scaleY(1) scaleX(1) skewX(0deg); } 30% { transform: scaleY(1.08) scaleX(0.95) skewX(-2deg); } 60% { transform: scaleY(0.93) scaleX(1.05) skewX(2deg); } 100% { transform: scaleY(1) scaleX(1) skewX(0deg); } }
      @keyframes fflickerI { 0% { transform: scaleY(1) skewX(1deg); } 40% { transform: scaleY(1.12) skewX(-2deg); } 70% { transform: scaleY(0.9) skewX(1deg); } 100% { transform: scaleY(1) skewX(1deg); } }
      @keyframes fglowpulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.1); } }
      @keyframes fember { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--fex,6px),-70px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .fbob-1, .fbob-2, .ftail, .fai-pulse, .fai-spin, .ftwinkle, .fblink, .fflame-o, .fflame-i, .fglow-pulse, .fember-1, .fember-2, .fember-3 { animation: none; }
      }
    </style>
    <clipPath id="fframe"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#fframe)">
    <rect width="1200" height="320" rx="24" fill="url(#fsky)"/>

    <!-- stars -->
    <use href="#fsparkle" class="ftwinkle" x="120" y="50" width="18" height="18"/>
    <use href="#fsparkle" class="ftwinkle d2" x="300" y="35" width="14" height="14"/>
    <use href="#fsparkle" class="ftwinkle d3" x="520" y="60" width="16" height="16"/>
    <use href="#fsparkle" class="ftwinkle" x="760" y="40" width="20" height="20"/>
    <use href="#fsparkle" class="ftwinkle d2" x="980" y="55" width="14" height="14"/>
    <use href="#fsparkle" class="ftwinkle d3" x="1100" y="30" width="18" height="18"/>
    <use href="#fsparkle" class="ftwinkle" x="60" y="140" width="12" height="12"/>
    <use href="#fsparkle" class="ftwinkle d2" x="1150" y="130" width="12" height="12"/>

    <!-- ground -->
    <ellipse cx="600" cy="300" rx="560" ry="40" fill="#0B2A4A" opacity="0.6" filter="url(#fsoft)"/>

    <!-- campfire, center -->
    <g transform="translate(600 258)">
      <ellipse cx="0" cy="8" rx="90" ry="20" fill="url(#ffireGlow)" class="fglow-pulse"/>
      <!-- logs -->
      <rect x="-34" y="4" width="68" height="10" rx="5" fill="#6B4228" transform="rotate(10)"/>
      <rect x="-34" y="4" width="68" height="10" rx="5" fill="#8A5A36" transform="rotate(-14)"/>
      <!-- flames -->
      <g><g class="fflame-o">
        <path d="M0 0 C -22 -18, -16 -42, 0 -62 C 16 -42, 22 -18, 0 0 Z" fill="url(#fflameOuter)"/>
      </g></g>
      <g><g class="fflame-i">
        <path d="M0 -4 C -12 -14, -9 -32, 0 -46 C 9 -32, 12 -14, 0 -4 Z" fill="url(#fflameInner)"/>
      </g></g>
      <!-- embers -->
      <circle class="fember-1" cx="-6" cy="-20" r="2.5" fill="#FFC27A" style="--fex:-14px"/>
      <circle class="fember-2" cx="8" cy="-18" r="2" fill="#FFD9A0" style="--fex:10px"/>
      <circle class="fember-3" cx="0" cy="-24" r="2.2" fill="#FFB15C" style="--fex:4px"/>
    </g>

    <!-- AI companion: orange glow sparkle, right side of fire -->
    <g transform="translate(760 220)"><g class="fbob-2">
      <g class="fai-pulse">
        <circle r="38" fill="url(#faiGlow)" filter="url(#fglowAI)"/>
      </g>
      <g class="fai-spin">
        <use href="#fsparkle" x="-26" y="-26" width="52" height="52" fill="#FFFFFF" opacity="0.9"/>
      </g>
      <circle r="9" fill="#FFFFFF"/>
    </g></g>

    <!-- gatito celeste, left side of fire -->
    <g transform="translate(420 240)"><g class="fbob-1">
      <!-- tail -->
      <path class="ftail" d="M34 10 C 70 0, 90 -30, 78 -55" fill="none" stroke="url(#fcatBody)" stroke-width="12" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="0" cy="20" rx="46" ry="34" fill="url(#fcatBody)"/>
      <!-- head -->
      <circle cx="10" cy="-28" r="34" fill="url(#fcatBody)"/>
      <!-- ears -->
      <path d="M-14 -50 L-22 -78 L4 -58 Z" fill="url(#fcatBody)"/>
      <path d="M34 -50 L44 -78 L16 -58 Z" fill="url(#fcatBody)"/>
      <path d="M-10 -56 L-14 -70 L0 -59 Z" fill="#F59CC8" opacity="0.8"/>
      <path d="M30 -56 L36 -70 L22 -59 Z" fill="#F59CC8" opacity="0.8"/>
      <!-- face, looking toward the fire (right) -->
      <g class="fblink">
        <ellipse cx="0" cy="-28" rx="5" ry="6" fill="#123E6B"/>
        <ellipse cx="26" cy="-28" rx="5" ry="6" fill="#123E6B"/>
      </g>
      <path d="M8 -16 q 4 5 8 0" fill="none" stroke="#123E6B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- whiskers -->
      <path d="M-14 -14 L-38 -18 M-14 -8 L-38 -8 M34 -14 L58 -18 M34 -8 L58 -8" stroke="#FFFFFF" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
      <!-- paws -->
      <ellipse cx="-16" cy="48" rx="12" ry="9" fill="#FFFFFF"/>
      <ellipse cx="28" cy="48" rx="12" ry="9" fill="#FFFFFF"/>
    </g></g>
  </g>
</svg>
