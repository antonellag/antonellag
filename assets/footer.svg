<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="pt pd" shape-rendering="crispEdges">
  <title id="pt">Ventana retro "universo.exe" con un gatito blob celeste</title>
  <desc id="pd">Una ventana estilo Windows retro llamada universo.exe, con un gatito blob celeste de ojitos cerrados y mejillas rosas, cielo con nubes y pasto, pixel art.</desc>
  <defs>
    <style>
      .wbob { animation: wbob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .wtwinkle { animation: wtwinkle 1.6s steps(2) infinite; }
      .wtwinkle.d2 { animation-delay: -0.6s; }
      .wspark { animation: wspark 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .wcursor { animation: wcursor 2s ease-in-out infinite; }
      .wcloud { animation: wcloud 14s linear infinite; }
      .wcloud.d2 { animation-delay: -6s; animation-duration: 18s; }
      @keyframes wbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes wtwinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes wspark { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.15) rotate(10deg); } }
      @keyframes wcursor { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-6px,6px); } }
      @keyframes wcloud { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
      @media (prefers-reduced-motion: reduce) {
        .wbob, .wtwinkle, .wspark, .wcursor, .wcloud { animation: none; }
      }
    </style>
    <clipPath id="wscreen"><rect x="40" y="76" width="1120" height="204"/></clipPath>
  </defs>

  <!-- window backdrop -->
  <rect width="1200" height="320" fill="#0B2A4A"/>

  <!-- window frame -->
  <rect x="24" y="20" width="1152" height="280" rx="14" fill="#2F86D6"/>
  <rect x="34" y="66" width="1132" height="224" fill="#6DB6F2"/>

  <!-- title bar -->
  <g>
    <rect x="24" y="20" width="1152" height="46" rx="14" fill="#2F86D6"/>
    <rect x="24" y="46" width="1152" height="20" fill="#2F86D6"/>
    <text x="52" y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="1">universo.exe</text>
    <!-- window controls -->
    <rect x="1030" y="32" width="34" height="24" fill="#153A63"/>
    <rect x="1040" y="42" width="14" height="4" fill="#FFFFFF"/>
    <rect x="1074" y="32" width="34" height="24" fill="#153A63"/>
    <rect x="1082" y="38" width="18" height="12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="1118" y="32" width="34" height="24" fill="#E8546B"/>
    <rect x="1128" y="40" width="14" height="4" fill="#FFFFFF" transform="rotate(45 1135 42)"/>
    <rect x="1128" y="40" width="14" height="4" fill="#FFFFFF" transform="rotate(-45 1135 42)"/>
  </g>

  <g clip-path="url(#wscreen)">
    <!-- sky -->
    <rect x="34" y="66" width="1132" height="224" fill="#9FD0FA"/>

    <!-- clouds -->
    <g class="wcloud" fill="#FFFFFF">
      <rect x="110" y="92" width="126" height="36"/>
      <rect x="138" y="68" width="84" height="36"/>
      <rect x="930" y="124" width="140" height="36"/>
      <rect x="965" y="100" width="84" height="36"/>
    </g>
    <g class="wcloud d2" fill="#FFFFFF">
      <rect x="490" y="82" width="112" height="30"/>
      <rect x="510" y="62" width="70" height="30"/>
    </g>

    <!-- grass ground -->
    <rect x="34" y="242" width="1132" height="48" fill="#4E9B5E"/>
    <rect x="34" y="242" width="1132" height="10" fill="#6BC47A"/>
    <rect x="200" y="236" width="60" height="8" fill="#6BC47A"/>
    <rect x="860" y="236" width="70" height="8" fill="#6BC47A"/>

    <!-- cursor, pointing at the cat -->
    <g transform="translate(760 130)" class="wcursor">
      <polygon points="0,0 0,46 12,34 20,52 30,48 22,30 40,30" fill="#FFFFFF" stroke="#153A63" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- gatito blob celeste, todo con círculos redondeados -->
    <g transform="translate(470 250)"><g class="wbob">
      <!-- ear outlines, pointed like a cat (not round like a mouse), behind the body -->
      <path d="M -82,-40 Q -90,-95 -48,-130 Q -6,-95 -14,-40 Z" fill="#102A43"/>
      <path d="M 14,-40 Q 6,-95 48,-130 Q 90,-95 82,-40 Z" fill="#102A43"/>
      <!-- body outline -->
      <circle cx="0" cy="8" r="92" fill="#102A43"/>
      <!-- ear fills -->
      <path d="M -72,-44 Q -78,-88 -48,-118 Q -18,-88 -24,-44 Z" fill="#D6EEFF"/>
      <path d="M 24,-44 Q 18,-88 48,-118 Q 78,-88 72,-44 Z" fill="#D6EEFF"/>
      <!-- inner ear, lighter -->
      <path d="M -62,-48 Q -66,-80 -48,-102 Q -30,-80 -34,-48 Z" fill="#EAF6FF"/>
      <path d="M 34,-48 Q 30,-80 48,-102 Q 66,-80 62,-48 Z" fill="#EAF6FF"/>
      <!-- body fill, drawn last to tuck the base of the ears behind it -->
      <circle cx="0" cy="8" r="84" fill="#D6EEFF"/>

      <!-- closed happy eyes -->
      <g fill="#153A63">
        <rect x="-44" y="-16" width="22" height="7"/>
        <rect x="-50" y="-10" width="8" height="7"/>
        <rect x="22" y="-16" width="22" height="7"/>
        <rect x="42" y="-10" width="8" height="7"/>
      </g>

      <!-- blush -->
      <circle cx="-54" cy="14" r="11" fill="#F59CC8"/>
      <circle cx="54" cy="14" r="11" fill="#F59CC8"/>

      <!-- mouth -->
      <rect x="-10" y="20" width="6" height="6" fill="#153A63"/>
      <rect x="-4" y="26" width="8" height="6" fill="#153A63"/>
      <rect x="4" y="20" width="6" height="6" fill="#153A63"/>

      <!-- paws -->
      <circle cx="-42" cy="78" r="26" fill="#D6EEFF" stroke="#102A43" stroke-width="8"/>
      <circle cx="42" cy="78" r="26" fill="#D6EEFF" stroke="#102A43" stroke-width="8"/>
      <circle cx="98" cy="56" r="18" fill="#D6EEFF" stroke="#102A43" stroke-width="8"/>
    </g></g>

    <!-- stars inside the screen, twinkling -->
    <rect class="wtwinkle" x="300" y="90" width="8" height="8" fill="#FFFFFF"/>
    <rect class="wtwinkle d2" x="860" y="170" width="8" height="8" fill="#FFFFFF"/>
  </g>
</svg>
