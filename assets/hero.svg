<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Antonella González, AI Product Builder</title>
  <desc id="d">Cielo celeste con nubes y objetos flotando. Diseño, producto y código.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F86D6"/>
      <stop offset="0.55" stop-color="#6DB6F2"/>
      <stop offset="1" stop-color="#CFEAFF"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E4F3FF"/>
      <stop offset="0.55" stop-color="#9FD0FA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#D6EEFF"/>
      <stop offset="1" stop-color="#5FA8EE"/>
    </radialGradient>
    <radialGradient id="bubblePink" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FFE0F0"/>
      <stop offset="1" stop-color="#F59CC8"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFE2FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1D5FA3" flood-opacity="0.45"/>
    </filter>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="url(#star)"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 300 120">
      <g fill="#FFFFFF">
        <ellipse cx="80" cy="80" rx="70" ry="38"/>
        <ellipse cx="150" cy="58" rx="62" ry="50"/>
        <ellipse cx="220" cy="80" rx="72" ry="36"/>
        <ellipse cx="150" cy="92" rx="120" ry="26"/>
      </g>
    </symbol>
    <style>
      .drift-a { animation: drift 40s linear infinite; }
      .drift-b { animation: drift 60s linear infinite reverse; }
      .bob-1 { animation: bob 6s ease-in-out infinite; }
      .bob-2 { animation: bob 7.5s ease-in-out infinite -2s; }
      .bob-3 { animation: bob 5.5s ease-in-out infinite -4s; }
      .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle.d2 { animation-delay: -1s; }
      .twinkle.d3 { animation-delay: -2s; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes drift { from { transform: translateX(-60px); } 50% { transform: translateX(60px); } to { transform: translateX(-60px); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .bob-1, .bob-2, .bob-3, .spin, .twinkle, .blink { animation: none; }
      }
      .name { font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-weight: 700; }
    </style>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">

  <rect width="1200" height="420" rx="24" fill="url(#sky)"/>

  <!-- far clouds -->
  <g class="drift-b" opacity="0.55" filter="url(#soft)">
    <use href="#cloud" x="-40" y="40" width="300" height="120"/>
    <use href="#cloud" x="880" y="20" width="360" height="140"/>
  </g>

  <!-- floating objects, left -->
  <g class="bob-1">
    <circle cx="150" cy="150" r="34" fill="url(#bubble)"/>
    <ellipse cx="138" cy="136" rx="10" ry="6" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g class="bob-2">
    <g class="spin">
      <ellipse cx="270" cy="105" rx="34" ry="12" fill="none" stroke="#FFFFFF" stroke-width="7" opacity="0.9"/>
    </g>
    <circle cx="270" cy="105" r="14" fill="url(#bubblePink)"/>
  </g>
  <!-- pixel cursor -->
  <g transform="translate(205 235)"><g class="bob-3">
    <path d="M0 0 h6 v6 h6 v6 h6 v6 h6 v6 h-12 v12 h-6 v-6 h-6 v6 h-6 z" fill="#FFFFFF" stroke="#1D5FA3" stroke-width="3" stroke-linejoin="round"/>
  </g></g>

  <!-- floating objects, right -->
  <g class="bob-2">
    <circle cx="1050" cy="160" r="40" fill="url(#bubblePink)"/>
    <ellipse cx="1036" cy="144" rx="12" ry="7" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <!-- film frame (cine) -->
  <g transform="translate(930 80) rotate(-10)"><g class="bob-1">
    <rect width="70" height="52" rx="8" fill="#FFFFFF"/>
    <rect x="12" y="10" width="46" height="32" rx="4" fill="#6DB6F2"/>
    <g fill="#FFFFFF" opacity="0.9"><rect x="3" y="12" width="5" height="5" rx="1" fill="#6DB6F2"/><rect x="3" y="24" width="5" height="5" rx="1" fill="#6DB6F2"/><rect x="3" y="36" width="5" height="5" rx="1" fill="#6DB6F2"/><rect x="62" y="12" width="5" height="5" rx="1" fill="#6DB6F2"/><rect x="62" y="24" width="5" height="5" rx="1" fill="#6DB6F2"/><rect x="62" y="36" width="5" height="5" rx="1" fill="#6DB6F2"/></g>
    <path d="M30 18 L44 26 L30 34 Z" fill="#FFFFFF"/>
  </g></g>
  <!-- code tag -->
  <g transform="translate(985 250)"><g class="bob-3">
    <rect width="92" height="44" rx="22" fill="#FFFFFF" opacity="0.95"/>
    <text x="46" y="30" text-anchor="middle" class="mono" font-size="20" fill="#2F86D6">&lt;/&gt;</text>
  </g></g>

  <!-- sparkles -->
  <use href="#sparkle" class="twinkle" x="340" y="60" width="26" height="26"/>
  <use href="#sparkle" class="twinkle d2" x="830" y="70" width="20" height="20"/>
  <use href="#sparkle" class="twinkle d3" x="880" y="300" width="28" height="28"/>
  <use href="#sparkle" class="twinkle d2" x="300" y="300" width="18" height="18"/>
  <use href="#sparkle" class="twinkle" x="1120" y="70" width="18" height="18"/>
  <use href="#sparkle" class="twinkle d3" x="70" y="80" width="16" height="16"/>

  <!-- title -->
  <g filter="url(#glow)">
    <text x="600" y="205" text-anchor="middle" class="name" font-size="84" fill="url(#chrome)" stroke="#FFFFFF" stroke-width="1.5" letter-spacing="-1">Antonella González</text>
  </g>

  <!-- pixel speech bubble -->
  <g transform="translate(600 262)">
    <rect x="-290" y="-26" width="580" height="52" rx="6" fill="#FFFFFF" stroke="#123E6B" stroke-width="4"/>
    <path d="M-30 26 L-18 44 L-6 26" fill="#FFFFFF" stroke="#123E6B" stroke-width="4" stroke-linejoin="miter"/>
    <rect x="-34" y="20" width="32" height="8" fill="#FFFFFF"/>
    <text x="-8" y="8" text-anchor="middle" class="mono" font-size="19" fill="#123E6B" letter-spacing="2">AI PRODUCT BUILDER · DISEÑO · CÓDIGO</text>
    <rect class="blink" x="262" y="-10" width="11" height="20" fill="#2F86D6"/>
  </g>

  <!-- front clouds -->
  <g class="drift-a">
    <use href="#cloud" x="-60" y="320" width="380" height="150"/>
    <use href="#cloud" x="300" y="345" width="320" height="120"/>
    <use href="#cloud" x="600" y="335" width="360" height="140"/>
    <use href="#cloud" x="900" y="320" width="400" height="150"/>
  </g>

  <text x="600" y="404" text-anchor="middle" class="mono" font-size="14" fill="#2F86D6" letter-spacing="3" opacity="0.85">✦ ESTE ES MI UNIVERSO ✦</text>
  </g>
</svg>
